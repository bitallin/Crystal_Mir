name: ${CRYSTAL_COMPOSE_PROJECT:-crystal}

services:
  postgres:
    image: ${CRYSTAL_POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: crystal
      POSTGRES_USER: crystal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CRYSTAL_COMPOSE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crystal -d crystal"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: ${CRYSTAL_REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  s3mock:
    image: ${CRYSTAL_S3MOCK_IMAGE:-adobe/s3mock:5.2.3}
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: crystal-content
    ports:
      - "127.0.0.1:${CRYSTAL_COMPOSE_S3MOCK_PORT:-19090}:9090"
    volumes:
      - s3mock-data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-migrate:
    image: ${CRYSTAL_POSTGRES_IMAGE:-postgres:16}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: crystal
      PGUSER: crystal
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        for migration in /migrations/*.sql; do
          echo "Applying $$migration"
          psql -v ON_ERROR_STOP=1 -f "$$migration"
        done
    restart: "no"

  control-api:
    image: ${CRYSTAL_CONTROL_API_IMAGE:-crystal/control-api:dev}
    build:
      context: .
      dockerfile: deploy/docker/control-api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${CRYSTAL_WEB_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Crystal: Host=postgres;Port=5432;Database=crystal;Username=crystal;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CRYSTAL_CONTROL_JWT_SIGNING_KEY: ${CRYSTAL_CONTROL_JWT_SIGNING_KEY:?set CRYSTAL_CONTROL_JWT_SIGNING_KEY in .env}
      CRYSTAL_CONTROL_BOOTSTRAP_PASSWORD: ${CRYSTAL_CONTROL_BOOTSTRAP_PASSWORD:?set CRYSTAL_CONTROL_BOOTSTRAP_PASSWORD in .env}
      ControlApi__AssetRoot: /var/lib/crystal/assets
      ControlApi__ReleaseRoot: /var/lib/crystal/releases
      CRYSTAL_CONTROL_RELEASE_SIGNING_PRIVATE_KEY_PATH: /run/crystal-signing/private.pem
      CRYSTAL_CONTROL_RELEASE_SIGNING_PUBLIC_KEY_PATH: /run/crystal-signing/public.pem
      CRYSTAL_CONTROL_RELEASE_SIGNING_KEY_ID: ${CRYSTAL_CONTROL_RELEASE_SIGNING_KEY_ID:-local-dev}
      ControlApi__ApiRateLimitPermitLimit: ${CRYSTAL_CONTROL_API_RATE_LIMIT:-2000}
      ControlApi__AuthRateLimitPermitLimit: ${CRYSTAL_CONTROL_AUTH_RATE_LIMIT:-100}
    volumes:
      - release-artifacts:/var/lib/crystal/releases
      - ${CRYSTAL_CONTROL_ASSET_ROOT:-./tests/fixtures/content}:/var/lib/crystal/assets:ro
      - ${CRYSTAL_CONTROL_SIGNING_DIR:-./artifacts/control-signing}:/run/crystal-signing:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  control-web:
    image: ${CRYSTAL_CONTROL_WEB_IMAGE:-crystal/control-web:dev}
    build:
      context: .
      dockerfile: deploy/docker/control-web.Dockerfile
    depends_on:
      control-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CRYSTAL_COMPOSE_WEB_PORT:-18088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web-gateway:
    profiles: ["web"]
    image: ${CRYSTAL_WEB_GATEWAY_IMAGE:-crystal/web-gateway:dev}
    build:
      context: .
      dockerfile: deploy/docker/web-gateway.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CRYSTAL_WEB_ZONE_ID: default
      CRYSTAL_WEB_ZONE_TCP: ${CRYSTAL_WEB_ZONE_TCP:-host.docker.internal:7000}
      CRYSTAL_WEB_ALLOWED_ORIGINS: ${CRYSTAL_WEB_ALLOWED_ORIGINS:-http://localhost:18089}
      CRYSTAL_WEB_ASSET_VERSION: ${CRYSTAL_WEB_ASSET_VERSION:-dev}
      CRYSTAL_WEB_ASSET_MANIFEST_URL: /assets/${CRYSTAL_WEB_ASSET_VERSION:-dev}/manifest.json
      CRYSTAL_WEB_CLIENT_BUILD_HASH: ${CRYSTAL_WEB_CLIENT_BUILD_HASH:-sha256:dev}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${CRYSTAL_COMPOSE_WEB_GATEWAY_PORT:-15080}:5080"
    restart: unless-stopped

  web-client:
    profiles: ["web"]
    image: ${CRYSTAL_WEB_CLIENT_IMAGE:-crystal/web-client:dev}
    build:
      context: .
      dockerfile: deploy/docker/web-client.Dockerfile
    depends_on:
      - web-gateway
    volumes:
      - ${CRYSTAL_WEB_ASSET_ROOT:-./artifacts/web-assets}:/usr/share/nginx/html/assets:ro
    ports:
      - "127.0.0.1:${CRYSTAL_COMPOSE_WEB_CLIENT_PORT:-18089}:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  s3mock-data:
  release-artifacts:

networks:
  default:
    ipam:
      config:
        - subnet: ${CRYSTAL_COMPOSE_SUBNET:-172.28.0.0/16}
